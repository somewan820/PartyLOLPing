[package]
name = "party-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
gpui-kit = "0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"
objc = "0.2"
raw-window-handle = "0.6"

[profile.release]
panic = "abort"
